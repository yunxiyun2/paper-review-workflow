[project]
name = "paper-review-workflow"
version = "0.1.0"
description = "AI workflow for comprehensive academic paper review and scoring"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pymupdf>=1.24.0",
    "arxiv>=2.1.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.12",
]

[project.scripts]
prw = "paper_review_workflow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paper_review_workflow"]

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end tests requiring ANTHROPIC_API_KEY",
]
testpaths = ["tests"]
