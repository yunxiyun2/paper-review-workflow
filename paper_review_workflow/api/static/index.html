<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paper Review Workflow</title>
  <script>
    document.documentElement.dataset.theme =
      localStorage.getItem('prw-theme') || 'paper';
  </script>
  <style>
    :root {
      --bg: #faf9f6; --surface: #ffffff; --surface2: #f4f2ec; --surface3: #ecebe3;
      --border: #e4e1d6; --border-strong: #cfcabb;
      --text: #22251f; --text2: #6b6e64; --text3: #98998f;
      --accent: #0e8a6d; --accent-strong: #0b6f58; --accent-tint: #e7f4ef;
      --success: #2e7d4f; --failure: #c0392f; --warning: #a8842c;
      --pending: #8b8d83; --running: #2563eb; --cancelled: #a8842c;
      --running-tint: #e8effc;
      --grid-dot: rgba(35,32,24,.032);
      --nav-bg: rgba(255,255,255,.72);
      --tint-pending: #f1f0ea; --tint-success: #e7f3ea;
      --tint-failure: #fbeae8; --tint-cancelled: #f6efdd;
      --danger-border: #e5b5b1; --danger-tint: #fbeae8;
      --result-bg: #e7f3ea; --result-border: #b7d8c4;
      --log-bg: #ffffff; --log-border: #e4e1d6;
      --log-text: #3a3d35; --log-ts: #98998f;
      --log-wf: #22251f; --log-job: #0b6f58; --log-step: #6b6e64;
      --log-ok: #2e7d4f; --log-err: #c0392f; --log-warn: #a8842c;
      --log-call: #0b6f58; --log-think: #98998f;
      --radius: 8px;
      --serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", "STSong", serif;
      --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --shadow-sm: 0 1px 2px rgba(35,32,24,.05);
      --shadow-md: 0 6px 20px rgba(35,32,24,.09);
    }
    /* 深空精密工作台 theme */
    :root[data-theme="space"] {
      --bg: #0b0d10; --surface: #14171d; --surface2: #1b1f27; --surface3: #262b33;
      --border: #262b33; --border-strong: #39414e;
      --text: #e8eaf0; --text2: #9aa1ad; --text3: #626975;
      --accent: #8b7ff5; --accent-strong: #a49af8; --accent-tint: rgba(139,127,245,.16);
      --success: #4ade80; --failure: #f87171; --warning: #fbbf24;
      --pending: #6b7280; --running: #60a5fa; --cancelled: #fbbf24;
      --running-tint: rgba(96,165,250,.15);
      --grid-dot: rgba(232,234,240,.045);
      --nav-bg: rgba(20,23,29,.72);
      --tint-pending: #23262c; --tint-success: rgba(74,222,128,.12);
      --tint-failure: rgba(248,113,113,.12); --tint-cancelled: rgba(251,191,36,.12);
      --danger-border: rgba(248,113,113,.4); --danger-tint: rgba(248,113,113,.1);
      --result-bg: rgba(139,127,245,.1); --result-border: rgba(139,127,245,.45);
      --log-bg: #0d1117; --log-border: #30363d;
      --log-text: #c9d1d9; --log-ts: #6e7681;
      --log-wf: #e6edf3; --log-job: #7ee787; --log-step: #a5b1c2;
      --log-ok: #7ee787; --log-err: #ff7b72; --log-warn: #d29922;
      --log-call: #79c0ff; --log-think: #8b949e;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
      --shadow-md: 0 8px 24px rgba(0,0,0,.5);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--sans); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.6;
      background-color: var(--bg);
      background-image: radial-gradient(var(--grid-dot) 1px, transparent 1px);
      background-size: 22px 22px;
    }
    /* ── Floating glass pill nav ── */
    .topbar {
      position: sticky; top: 14px; z-index: 100;
      display: flex; align-items: center; justify-content: center;
      padding: 0 20px; height: 64px;
    }
    .logo {
      position: absolute; left: 28px; display: flex; align-items: center; gap: 8px;
      font-family: var(--serif); font-size: 16px; font-weight: 700; letter-spacing: .02em; color: var(--text);
    }
    .logo svg { color: var(--accent); }
    .nav-pill {
      position: relative; display: flex; align-items: center; gap: 2px;
      background: var(--nav-bg); backdrop-filter: blur(14px) saturate(1.4);
      -webkit-backdrop-filter: blur(14px) saturate(1.4);
      border: 1px solid var(--border); border-radius: 999px; padding: 5px;
      box-shadow: var(--shadow-md);
    }
    .nav-thumb {
      position: absolute; top: 5px; bottom: 5px; left: 0; width: 0;
      background: var(--accent-tint); border: 1px solid var(--accent); border-radius: 999px;
      transition: transform .25s cubic-bezier(.4,0,.2,1), width .25s cubic-bezier(.4,0,.2,1);
      pointer-events: none;
    }
    .tab-btn {
      position: relative; z-index: 1;
      background: none; border: none; color: var(--text2); cursor: pointer;
      padding: 7px 18px; border-radius: 999px; font-size: 13px; font-weight: 500;
      transition: color .2s;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--accent-strong); font-weight: 600; }
    .ws-status {
      position: absolute; right: 28px; display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--text2);
      background: var(--nav-bg); border: 1px solid var(--border);
      border-radius: 999px; padding: 5px 12px; backdrop-filter: blur(10px);
    }
    .ws-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text3); transition: background .3s; }
    .ws-dot.connected { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
    .ws-dot.disconnected { background: var(--failure); box-shadow: 0 0 0 3px var(--tint-failure); }
    @media (max-width: 920px) { .logo span, .ws-status span { display: none; } }
    .main-panel { padding: 28px 20px 60px; max-width: 1200px; margin: 0 auto; }
    .tab-content { display: none; animation: tabIn .25s ease; }
    .tab-content.active { display: block; }
    @keyframes tabIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    /* ── Paper cards ── */
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      margin-bottom: 16px; overflow: hidden; box-shadow: var(--shadow-sm);
      transition: box-shadow .2s ease, border-color .2s ease;
    }
    .card:hover { box-shadow: var(--shadow-md); border-color: var(--border-strong); }
    .card-header {
      padding: 12px 18px; border-bottom: 1px solid var(--border);
      font-family: var(--serif); font-weight: 700; font-size: 15px; letter-spacing: .03em;
      display: flex; align-items: center; gap: 8px;
    }
    .card-body { padding: 18px; }
    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px;
      border-radius: var(--radius); border: 1px solid var(--border-strong); background: var(--surface);
      color: var(--text); cursor: pointer; font-size: 13px; font-weight: 500;
      transition: all .18s ease; white-space: nowrap;
    }
    .btn:hover { background: var(--surface2); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
    .btn:active { transform: none; }
    .btn svg { width: 15px; height: 15px; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
    .btn-danger { background: var(--surface); border-color: var(--danger-border); color: var(--failure); }
    .btn-danger:hover { background: var(--danger-tint); border-color: var(--failure); }
    /* ── Status badges ── */
    .badge {
      display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px;
      border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: .04em;
    }
    .badge .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .badge.pending { background: var(--tint-pending); color: var(--pending); }
    .badge.running { background: var(--running-tint); color: var(--running); }
    .badge.success { background: var(--tint-success); color: var(--success); }
    .badge.failure { background: var(--tint-failure); color: var(--failure); }
    .badge.cancelled { background: var(--tint-cancelled); color: var(--cancelled); }
    .badge.skipped { background: var(--tint-pending); color: var(--pending); }
    .jdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 2px; vertical-align: baseline; }
    .jdot.success { background: var(--success); }
    .jdot.running { background: var(--running); }
    .jdot.failure { background: var(--failure); }
    .jdot.cancelled { background: var(--cancelled); }
    .jdot.pending { background: var(--pending); }
    .jdot.skipped { background: var(--text3); }
    /* ── Forms ── */
    input, select, textarea {
      background: var(--surface); border: 1px solid var(--border-strong); color: var(--text);
      border-radius: var(--radius); padding: 7px 11px; font-size: 13px; width: 100%;
      transition: border-color .18s, box-shadow .18s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint);
    }
    label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 5px; margin-top: 12px; font-weight: 500; }
    .form-row { margin-bottom: 12px; }
    /* ── Log panel ── */
    .log-box {
      background: var(--log-bg); border: 1px solid var(--log-border); border-radius: var(--radius);
      padding: 12px; max-height: 440px; overflow-y: auto; font-family: var(--mono); font-size: 12px; line-height: 1.75;
    }
    .log-line { color: var(--log-text); white-space: pre-wrap; word-break: break-all; animation: logIn .18s ease; }
    @keyframes logIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
    .log-line .ts { color: var(--log-ts); }
    .log-line.wf { color: var(--log-wf); font-weight: 600; border-top: 1px dashed var(--log-border); padding-top: 5px; margin-top: 3px; }
    .log-line.job { color: var(--log-job); }
    .log-line.step { color: var(--log-step); padding-left: 18px; }
    .log-line.llm { color: var(--log-text); }
    .log-line.ok { color: var(--log-ok); }
    .log-line.err { color: var(--log-err); }
    .log-line.think { color: var(--log-think); font-style: italic; }
    .copy-icon {
      background: none; border: none; color: var(--text3); cursor: pointer;
      padding: 4px; display: inline-flex; border-radius: 6px; margin-left: auto;
      transition: color .15s ease;
    }
    .copy-icon:hover { color: var(--accent); }
    .copy-icon svg { width: 16px; height: 16px; }
    .copy-icon .icon-check { display: none; color: var(--success); }
    .copy-icon.copied .icon-copy { display: none; }
    .copy-icon.copied .icon-check { display: block; }
    /* ── Run list ── */
    .run-list { display: flex; flex-direction: column; gap: 6px; }
    .run-item {
      padding: 10px 12px; border-radius: var(--radius); cursor: pointer;
      border: 1px solid transparent; transition: all .16s ease; background: var(--surface);
    }
    .run-item:hover { border-color: var(--border-strong); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
    .run-item.active { background: var(--accent-tint); border-color: var(--accent); }
    .run-item .run-id { font-size: 11px; color: var(--text3); font-family: var(--mono); }
    /* ── Scores ── */
    .score-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .score-bar .label { width: 120px; font-size: 12px; color: var(--text2); }
    .score-bar .bar { flex: 1; height: 8px; background: var(--surface3); border-radius: 4px; overflow: hidden; }
    .score-bar .fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width .6s cubic-bezier(.4,0,.2,1); }
    .score-bar .val { flex-shrink: 0; min-width: 130px; font-size: 12px; text-align: right; font-family: var(--mono); white-space: nowrap; }
    .yaml-output {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 14px; font-family: var(--mono); font-size: 12px; white-space: pre-wrap;
      max-height: 320px; overflow-y: auto; line-height: 1.7;
    }
    .empty-state { text-align: center; padding: 40px; color: var(--text3); }
    .card-body p { margin-bottom: 7px; }
    .card-body ul { margin: 6px 0 14px; padding-left: 20px; }
    .card-body li { margin-bottom: 7px; line-height: 1.65; }
    .card-body ul + strong { display: block; margin-top: 4px; }
    input[type="file"] { font-size: 12px; color: var(--text2); }
    input[type="range"] { accent-color: var(--accent); padding: 0; }
    input[type="range"]:focus { box-shadow: none; }
    .log-line.call { color: var(--log-call); }
    .log-line.warn { color: var(--log-warn); }
    /* ── Theme toggle ── */
    .theme-toggle {
      position: fixed; right: 22px; bottom: 22px; z-index: 200;
      width: 42px; height: 42px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: var(--surface); border: 1px solid var(--border-strong);
      color: var(--text2); cursor: pointer; box-shadow: var(--shadow-md);
      transition: transform .18s ease, color .18s ease, border-color .18s ease;
    }
    .theme-toggle:hover { transform: translateY(-2px) rotate(12deg); color: var(--accent); border-color: var(--accent); }
    .theme-toggle svg { width: 18px; height: 18px; }
    :root[data-theme="space"] .icon-sun { display: none; }
    :root[data-theme="paper"] .icon-moon { display: none; }
    html, body { transition: background-color .25s ease, color .25s ease; }
  </style>
  </style>
</head>
<body>
  <div class="topbar">
    <span class="logo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6"/><path d="M9 17h4"/></svg>
      <span>论文评审台</span>
    </span>
    <nav class="nav-pill">
      <span class="nav-thumb" id="nav-thumb"></span>
      <button class="tab-btn active" data-tab="dispatch" onclick="switchTab('dispatch')">发起评审</button>
      <button class="tab-btn" data-tab="monitor" onclick="switchTab('monitor')">监控</button>
      <button class="tab-btn" data-tab="decision" onclick="switchTab('decision')">决策</button>
    </nav>
    <span class="ws-status">
      <span class="ws-dot" id="ws-dot"></span>
      <span id="ws-label">未连接</span>
    </span>
  </div>

  <div class="main-panel">
    <!-- Review tab: venue + weights + PDF upload + model + api key -->
    <div id="tab-dispatch" class="tab-content active">
      <div class="card">
        <div class="card-header">发起评审</div>
        <div class="card-body">
          <div class="form-row">
            <label>任务名称（显示在监控列表）</label>
            <input type="text" id="dis-task-name" placeholder="例如：ICML-疲劳检测论文评审" />
          </div>
          <div class="form-row">
            <label>评审会议</label>
            <select id="dis-venue" onchange="renderWeightSliders()"></select>
          </div>
          <div class="form-row">
            <label>维度权重（拖动滑块确认各维度比例）</label>
            <div id="dis-weights"></div>
          </div>
          <div class="form-row">
            <label>论文 PDF（仅支持上传 PDF，不支持链接导入）</label>
            <input type="file" id="dis-pdf" accept="application/pdf,.pdf" />
          </div>
          <div class="form-row">
            <label>模型厂商</label>
            <select id="dis-provider" onchange="onProviderChange()">
              <option value="zhipu">智谱 GLM</option>
              <option value="openai">OpenAI</option>
              <option value="deepseek">DeepSeek</option>
              <option value="anthropic">Anthropic</option>
            </select>
          </div>
          <div class="form-row">
            <label>模型</label>
            <select id="dis-model">
              <option value="glm-5.3">glm-5.3（旗舰·推荐）</option>
              <option value="glm-5.3-flash">glm-5.3-flash（快速·低价）</option>
              <option value="glm-5.2">glm-5.2</option>
              <option value="glm-4.6">glm-4.6</option>
              <option value="glm-4.5">glm-4.5</option>
              <option value="glm-4.5-air">glm-4.5-air</option>
              <option value="glm-4-flash">glm-4-flash</option>
            </select>
          </div>
          <div class="form-row">
            <label id="dis-key-label">API Key（仅保存在内存中，可在监控页手动删除）</label>
            <input type="password" id="dis-api-key" placeholder="你的 API Key" autocomplete="off" />
          </div>
          <div style="margin-top:14px;">
            <button class="btn btn-primary" onclick="uploadAndReview()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 9-14 9V3z"/></svg>开始评审</button>
          </div>
          <div id="dis-result" style="margin-top:14px;"></div>
          <p style="margin-top:14px;font-size:12px;color:var(--text3);">
            隐私说明：可在「监控」页手动删除 API Key，或删除整个任务（PDF、评审报告、运行记录一并删除）。
          </p>
        </div>
      </div>
    </div>

    <!-- M5: Monitor Tab -->
    <div id="tab-monitor" class="tab-content">
      <div style="display:flex;gap:14px;">
        <div class="card" style="flex:0 0 300px;">
          <div class="card-header">
            Run 列表
            <button class="btn btn-sm" style="float:right;" onclick="loadRuns()">刷新</button>
          </div>
          <div class="card-body">
            <div class="run-list" id="mon-run-list"></div>
          </div>
        </div>
        <div style="flex:1;">
          <div class="card">
            <div class="card-header">Run 详情</div>
            <div class="card-body" id="mon-detail">
              <p class="empty-state">选择左侧 run 查看详情</p>
            </div>
          </div>
          <div class="card">
            <div class="card-header">实时日志</div>
            <div class="card-body">
              <div class="log-box" id="mon-log"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- M6: Decision Tab -->
    <div id="tab-decision" class="tab-content">
      <div class="card">
        <div class="card-header">查看决策</div>
        <div class="card-body">
          <div class="form-row">
            <label>Select Run (仅显示成功的 run)</label>
            <select id="dec-run" onchange="loadDecision(this.value)"></select>
          </div>
        </div>
      </div>
      <div id="dec-content"></div>
    </div>
  </div>

  <script>
    // ── Global state ──
    const state = { venues: [], workflows: [], runs: [], activeRunId: null, ws: null };

    // ── Tab switching ──
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tabName).classList.add('active');
      document.querySelector('[data-tab="' + tabName + '"]').classList.add('active');
      moveNavThumb();
      if (tabName === 'monitor') loadRuns();
      if (tabName === 'decision') loadCompletedRuns();
    }

    function moveNavThumb() {
      const active = document.querySelector('.tab-btn.active');
      const thumb = document.getElementById('nav-thumb');
      if (!active || !thumb) return;
      thumb.style.width = active.offsetWidth + 'px';
      thumb.style.transform = 'translateX(' + active.offsetLeft + 'px)';
    }
    window.addEventListener('resize', moveNavThumb);

    // ── API utilities ──
    async function apiGet(path) {
      const r = await fetch(path);
      if (!r.ok) throw new Error('GET ' + path + ' failed: ' + r.status);
      return r.json();
    }
    async function apiPost(path, body) {
      const r = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      if (!r.ok) throw new Error('POST ' + path + ' failed: ' + r.status);
      return r.json();
    }

    // ── WebSocket status ──
    function updateWsStatus(status) {
      const dot = document.getElementById('ws-dot');
      const label = document.getElementById('ws-label');
      dot.className = 'ws-dot ' + status;
      label.textContent = status === 'connected' ? '已连接' : status === 'disconnected' ? '已断开' : '未连接';
    }

    // ── Review tab ──
    const DIM_LABELS = {
      soundness: '严谨性',
      presentation: '表达清晰度',
      contribution: '贡献性',
      excitement: '创新兴奋度',
      reproducibility: '可复现性',
      overall: '总体评价',
      significance: '重要性',
      originality: '原创性',
      clarity: '清晰性'
    };
    function dimLabel(dim) { return DIM_LABELS[dim] || dim; }

    async function loadVenues() {
      const data = await apiGet('/api/venues');
      state.venues = data.venues || [];
      const sel = document.getElementById('dis-venue');
      sel.innerHTML = state.venues.map(v => '<option value="' + v.name + '">' + v.display_name + '</option>').join('');
      renderWeightSliders();
    }

    function renderWeightSliders() {
      const venueName = document.getElementById('dis-venue').value;
      const venue = state.venues.find(v => v.name === venueName);
      if (!venue) return;
      const container = document.getElementById('dis-weights');
      container.innerHTML = venue.dimensions.map(dim => {
        const w = venue.weights[dim];
        return '<div class="form-row" style="display:flex;align-items:center;gap:10px;">' +
          '<label style="width:120px;margin:0;">' + dimLabel(dim) + '</label>' +
          '<input type="range" min="0.5" max="2.0" step="0.1" value="' + w + '" ' +
          'oninput="this.nextElementSibling.textContent=this.value" ' +
          'data-dim="' + dim + '" class="weight-slider" />' +
          '<span style="width:30px;text-align:center;">' + w + '</span>' +
          '</div>';
      }).join('');
    }

    const PROVIDER_MODELS = {
      zhipu:     { keyHint: '智谱开放平台',      models: ['glm-5.3', 'glm-5.3-flash', 'glm-5.2', 'glm-4.6', 'glm-4.5', 'glm-4.5-air', 'glm-4-flash'] },
      openai:    { keyHint: 'OpenAI 平台',      models: ['gpt-5', 'gpt-5-mini', 'gpt-4.1', 'gpt-4o'] },
      deepseek:  { keyHint: 'DeepSeek 开放平台', models: ['deepseek-chat', 'deepseek-reasoner'] },
      anthropic: { keyHint: 'Anthropic Console', models: ['claude-sonnet-4-6', 'claude-opus-4-1', 'claude-3-7-sonnet-latest'] }
    };

    function onProviderChange() {
      const conf = PROVIDER_MODELS[document.getElementById('dis-provider').value];
      const sel = document.getElementById('dis-model');
      sel.innerHTML = conf.models.map((m, i) =>
        '<option value="' + m + '">' + m + (i === 0 ? '（推荐）' : '') + '</option>').join('');
      document.getElementById('dis-key-label').textContent =
        'API Key（' + conf.keyHint + '，仅保存在内存中，可在监控页手动删除）';
    }

    function collectWeightValues() {
      const weights = {};
      document.querySelectorAll('.weight-slider').forEach(s => {
        weights[s.dataset.dim] = parseFloat(s.value);
      });
      return weights;
    }

    // ── Dispatch tab — ephemeral upload flow ──
    async function uploadAndReview() {
      const fileInput = document.getElementById('dis-pdf');
      const apiKeyEl = document.getElementById('dis-api-key');
      const model = document.getElementById('dis-model').value;
      const venue = document.getElementById('dis-venue').value;
      if (!fileInput.files.length) { alert('请选择论文 PDF'); return; }
      if (!apiKeyEl.value) { alert('请输入 API Key'); return; }
      const fd = new FormData();
      fd.append('pdf', fileInput.files[0]);
      fd.append('api_key', apiKeyEl.value);
      fd.append('model', model);
      fd.append('provider', document.getElementById('dis-provider').value);
      fd.append('venue', venue);
      fd.append('weights', JSON.stringify(collectWeightValues()));
      fd.append('task_name', document.getElementById('dis-task-name').value);
      const resultBox = document.getElementById('dis-result');
      resultBox.innerHTML = '<p style="color:var(--text2);">正在上传并派发评审…</p>';
      try {
        const r = await fetch('/api/review', { method: 'POST', body: fd });
        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          throw new Error(err.detail || ('HTTP ' + r.status));
        }
        const run = await r.json();
        // Clear the key from the form immediately — the server holds it in memory only
        apiKeyEl.value = '';
        resultBox.innerHTML =
          '<div class="card" style="border-color:var(--result-border);background:var(--result-bg);"><div class="card-body">' +
          '<p><strong>任务:</strong> ' + (run.task_name || '') + '</p>' +
          '<p><strong>run_id:</strong> ' + run.run_id + '</p>' +
          '<p><strong>model:</strong> ' + run.model + ' | <strong>venue:</strong> ' + run.venue + '</p>' +
          '<p style="font-size:12px;color:var(--text3);">API Key 保存在内存中，可在监控页删除；删除任务时 PDF/报告/记录一并清除</p>' +
          '<button class="btn btn-primary" onclick="switchTab(\'monitor\'); selectRun(\'' + run.run_id + '\');">前往监控</button>' +
          '</div></div>';
      } catch(e) {
        resultBox.innerHTML = '';
        alert('发起评审失败: ' + e.message);
      }
    }

    // ── Monitor tab (M5) ──
    async function loadRuns() {
      try {
        const data = await apiGet('/api/runs');
        state.runs = data.runs;
        renderRunList();
      } catch(e) { console.error('loadRuns failed:', e); }
    }

    function renderRunList() {
      const list = document.getElementById('mon-run-list');
      if (state.runs.length === 0) {
        list.innerHTML = '<p class="empty-state">暂无 run</p>';
        return;
      }
      list.innerHTML = state.runs.map(r => {
        const active = r.run_id === state.activeRunId ? 'active' : '';
        const name = r.task_name || r.workflow_name || r.run_id.substring(0, 20);
        return '<div class="run-item ' + active + '" onclick="selectRun(\'' + r.run_id + '\')">' +
          '<div><strong>' + name + '</strong> <span class="badge ' + r.status + '"><span class="dot"></span>' + r.status + '</span></div>' +
          '<div class="run-id">' + (r.workflow_name ? r.workflow_name + ' · ' : '') + r.run_id.substring(0, 12) + '...</div>' +
          '</div>';
      }).join('');
    }

    function selectRun(runId) {
      state.activeRunId = runId;
      renderRunList();
      document.getElementById('mon-log').innerHTML = '';
      loadRunDetail(runId);
    }

    async function loadRunDetail(runId) {
      try {
        const run = await apiGet('/api/runs/' + runId);
        const jobs = Object.entries(run.jobs || {}).map(function(entry) {
          const jid = entry[0], j = entry[1];
          return '<div><span class="jdot ' + j.status + '"></span> ' + jid +
            ' <span class="badge ' + j.status + '"><span class="dot"></span>' + j.status + '</span></div>';
        }).join('');
        // Aggregate token usage across all steps' llm_usage outputs
        let totalIn = 0, totalOut = 0, calls = 0;
        const perJob = [];
        Object.entries(run.jobs || {}).forEach(([jid, j]) => {
          let jIn = 0, jOut = 0, jCalls = 0;
          (j.steps || []).forEach(s => {
            const u = s.outputs && s.outputs.llm_usage;
            if (u) {
              jIn += u.input_tokens || 0; jOut += u.output_tokens || 0; jCalls += 1;
            }
          });
          if (jCalls > 0) {
            totalIn += jIn; totalOut += jOut; calls += jCalls;
            perJob.push('<div style="display:flex;align-items:baseline;gap:8px;font-size:12px;margin-bottom:3px;min-width:0;">' +
              '<span style="font-family:var(--mono);color:var(--text2);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:1;">' + jid + '</span>' +
              '<span style="color:var(--text2);white-space:nowrap;">input ' + jIn.toLocaleString() +
              ' · output ' + jOut.toLocaleString() + ' tokens</span></div>');
          }
        });
        const usageHtml = calls > 0
          ? '<p style="margin-top:4px;"><strong>Token Usage:</strong> input ' + totalIn.toLocaleString() +
            ' · output ' + totalOut.toLocaleString() + ' · total ' + (totalIn + totalOut).toLocaleString() +
            ' tokens (' + calls + ' model calls)</p>' + perJob.join('')
          : '<p style="margin-top:4px;font-size:12px;color:var(--text3);">Token Usage: no LLM calls recorded</p>';
        document.getElementById('mon-detail').innerHTML =
          '<p><strong>run_id:</strong> ' + run.run_id + '</p>' +
          '<p><strong>status:</strong> <span class="badge ' + run.status + '">' + run.status + '</span></p>' +
          '<p><strong>duration:</strong> ' + (run.duration ? run.duration.toFixed(1) + 's' : '-') + '</p>' +
          '<div style="margin-top:10px;"><strong>Jobs:</strong></div>' +
          '<div style="margin-top:6px;">' + (jobs || '<p class="empty-state">无</p>') + '</div>' +
          '<div style="margin-top:10px;"><strong>Token Usage</strong></div>' + usageHtml +
          '<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;">' +
          '<button class="btn btn-danger" onclick="cancelRun(\'' + run.run_id + '\')">取消</button>' +
          '<button class="btn" onclick="resumeRun(\'' + run.run_id + '\')">续跑</button>' +
          '<button class="btn" onclick="deleteRunKey(\'' + run.run_id + '\')">删除 API-Key</button>' +
          '<button class="btn btn-danger" onclick="deleteRun(\'' + run.run_id + '\')">删除任务</button>' +
          '</div>';
        // Replay historical step logs (incl. LLM call parameter/usage lines)
        const logBox = document.getElementById('mon-log');
        Object.values(run.jobs || {}).forEach(j => {
          (j.steps || []).forEach(s => {
            (s.log || []).forEach(line => {
              logBox.innerHTML += logHtml(logLineClass(line), '', line);
            });
          });
        });
        logBox.scrollTop = logBox.scrollHeight;
      } catch(e) { console.error('loadRunDetail failed:', e); }
    }

    // Global WebSocket: connects once at page load, receives all events,
    // and is filtered client-side by the selected run.
    function connectGlobalWS() {
      if (state.ws) { try { state.ws.close(); } catch(e) {} state.ws = null; }
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(proto + '://' + location.host + '/ws');
      ws.onopen = function() { updateWsStatus('connected'); };
      ws.onmessage = function(e) {
        try { handleWsEvent(JSON.parse(e.data)); } catch(err) {}
      };
      ws.onclose = function() {
        updateWsStatus('disconnected');
        setTimeout(connectGlobalWS, 3000);   // auto-reconnect
      };
      state.ws = ws;
    }

    function fmtDur(d) {
      return (d !== null && d !== undefined) ? Number(d).toFixed(1) + 's' : '';
    }
    function logLineClass(line) {
      if (!line) return 'llm';
      if (line.indexOf('💭') === 0) return 'think';
      if (line.indexOf('[ERROR]') !== -1 || line.indexOf('❌') === 0) return 'err';
      if (line.indexOf('📥') === 0 || line.indexOf('⚠️') === 0) return 'warn';
      if (line.indexOf('✅') === 0 || line.indexOf('🏁') === 0) return 'ok';
      if (line.indexOf('🤖') === 0) return 'call';
      return 'llm';
    }

    function logHtml(cls, ts, body) {
      const t = ts ? '<span class="ts">[' + ts + ']</span> ' : '';
      return '<div class="log-line ' + cls + '">' + t + body + '</div>';
    }

    // Structured log rendering: one visual language per event layer
    // (workflow → job → step → LLM calls / review content).
    function renderLogEvent(event) {
      const ev = event.event || '';
      if (ev === 'heartbeat' || ev === 'pong') return '';
      const d = event.data || {};
      const ts = event.timestamp ? new Date(event.timestamp).toLocaleTimeString() : '';
      switch (ev) {
        case 'workflow.started': {
          const bits = [d.venue ? 'venue=' + d.venue : '', d.model ? 'model=' + d.model : '',
                        d.task_name ? '「' + d.task_name + '」' : ''].filter(Boolean).join(' · ');
          return logHtml('wf', ts, '🚀 工作流开始: ' + (d.workflow_name || '') + (bits ? ' — ' + bits : ''));
        }
        case 'workflow.completed': {
          const ok = d.status === 'success';
          return logHtml('wf ' + (ok ? 'ok' : 'err'), ts,
            (ok ? '🏁 工作流完成: ' : '❌ 工作流结束: ') + (d.status || '') +
            (d.duration != null ? '（总耗时 ' + fmtDur(d.duration) + '）' : ''));
        }
        case 'workflow.cancelled':
          return logHtml('wf err', ts, '🛑 工作流已取消');
        case 'job.started':
          return logHtml('job', ts, '⚙️ Job 开始: ' + (event.job_id || '') + (d.name ? ' — ' + d.name : ''));
        case 'job.completed': {
          const ok = d.status === 'success';
          return logHtml('job ' + (ok ? 'ok' : 'err'), ts,
            (ok ? '✅' : '❌') + ' Job ' + (ok ? '完成' : '结束') + ': ' + (event.job_id || '') +
            ' (' + (d.status || '') + (d.duration != null ? ', ' + fmtDur(d.duration) : '') + ')');
        }
        case 'job.skipped':
          return logHtml('job', ts, '⏭️ Job 跳过: ' + (event.job_id || ''));
        case 'step.started':
          return logHtml('step', ts, '▶️ Step 开始: ' + (d.name || event.step_id || ''));
        case 'step.completed': {
          const ok = d.status === 'success';
          let body = (ok ? '✔️' : '✖️') + ' Step ' + (ok ? '完成' : '失败') + ': ' + (d.status || '') +
            (d.duration != null ? ', ' + fmtDur(d.duration) : '');
          if (d.error) body += ' — ' + String(d.error).slice(0, 200);
          let html = logHtml('step ' + (ok ? 'ok' : 'err'), ts, body);
          if (ok && d.outputs && Object.keys(d.outputs).length) {
            const parts = Object.entries(d.outputs)
              .filter(([k, v]) => k !== 'llm_usage' && typeof v !== 'object')
              .slice(0, 4)
              .map(([k, v]) => k + '=' + String(v).slice(0, 70));
            if (parts.length) html += logHtml('step llm', ts, '↳ ' + parts.join(' · '));
          }
          return html;
        }
        case 'step.skipped':
          return logHtml('step', ts, '⏭️ Step 跳过');
        case 'step.log': {
          return logHtml(logLineClass(d.line), ts, d.line || '');
        }
        default:
          return logHtml('', ts, ev);
      }
    }

    function handleWsEvent(event) {
      const ev = event.event || '';
      if (ev === 'heartbeat' || ev === 'pong') return;
      // Global socket sees all runs — render nothing until a run is selected,
      // then only show events of that run.
      if (!state.activeRunId || !event.run_id || event.run_id !== state.activeRunId) return;
      const html = renderLogEvent(event);
      if (!html) return;
      const logBox = document.getElementById('mon-log');
      logBox.innerHTML += html;
      logBox.scrollTop = logBox.scrollHeight;
      if (ev.indexOf('job.') === 0 || ev.indexOf('workflow.') === 0) {
        loadRunDetail(state.activeRunId);
      }
    }

    async function cancelRun(runId) {
      try { await apiPost('/api/runs/' + runId + '/cancel', {}); loadRunDetail(runId); }
      catch(e) { alert('取消失败: ' + e.message); }
    }
    async function resumeRun(runId) {
      // The key may no longer be in server memory (e.g. after a restart) —
      // let the user supply one; empty input relies on the stored key.
      const apiKey = prompt('续跑需要调用模型。请输入 API Key（若服务端仍保留 key，可直接留空）：');
      if (apiKey === null) return;
      try { await apiPost('/api/runs/' + runId + '/resume', { api_key: apiKey || null }); selectRun(runId); }
      catch(e) { alert('续跑失败: ' + e.message); }
    }

    async function deleteRunKey(runId) {
      try {
        const r = await apiPost('/api/runs/' + runId + '/delete-key', {});
        alert(r.message);
      } catch(e) { alert('删除 API-Key 失败: ' + e.message); }
    }

    async function deleteRun(runId) {
      if (!confirm('删除后该任务的 PDF、评审报告和运行记录将全部消失且不可恢复，确认删除？')) return;
      try {
        const r = await fetch('/api/runs/' + runId, { method: 'DELETE' });
        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          throw new Error(err.detail || ('HTTP ' + r.status));
        }
        state.activeRunId = null;
        document.getElementById('mon-detail').innerHTML = '<p class="empty-state">选择左侧 run 查看详情</p>';
        document.getElementById('mon-log').innerHTML = '';
        loadRuns();
        loadCompletedRuns();
      } catch(e) { alert('删除任务失败: ' + e.message); }
    }

    // ── Decision tab (M6) ──
    async function loadCompletedRuns() {
      try {
        const data = await apiGet('/api/runs?status=success');
        const sel = document.getElementById('dec-run');
        sel.innerHTML = '<option value="">-- 选择 run --</option>' +
          data.runs.map(r => '<option value="' + r.run_id + '">' +
            (r.task_name || '未命名评审') + ' (' + r.run_id.substring(0, 8) + ')</option>').join('');
        // Always reset to empty selection — never show a stale decision
        sel.value = '';
        document.getElementById('dec-content').innerHTML = '';
        state.lastReviewMd = '';
      } catch(e) { console.error('loadCompletedRuns failed:', e); }
    }

    async function loadDecision(runId) {
      const box = document.getElementById('dec-content');
      if (!runId) { box.innerHTML = ''; return; }
      // 1) Run meta (status/duration)
      let run = null;
      try { run = await apiGet('/api/runs/' + runId); } catch(e) { console.error(e); }
      // 2) Full decision payload from dedicated endpoint
      let decision = null;
      try { decision = await apiGet('/api/runs/' + runId + '/decision'); }
      catch(e) { /* decide not finished yet — fall back to outputs below */ }

      var html = '<div class="card"><div class="card-header">推荐决定</div><div class="card-body">';
      if (run) {
        html += '<p><strong>Status:</strong> <span class="badge ' + run.status + '">' + run.status + '</span></p>';
      }
      if (!decision) {
        html += '<p class="empty-state">该 run 尚未完成 decide 阶段，暂无决策数据</p></div></div>';
        box.innerHTML = html;
        return;
      }

      const scoreMax = decision.score_range ? decision.score_range[1] : 10;
      const rec = (decision.recommendation || '?').toLowerCase();
      const recCls = rec.includes('reject') ? 'failure' : rec.includes('accept') ? 'success' : 'cancelled';
      html += '<p><strong>Recommendation:</strong> <span class="badge ' + recCls + '">' + (decision.recommendation || '?') + '</span></p>' +
        '<p><strong>Weighted Score:</strong> ' + (decision.weighted_score != null ? decision.weighted_score : '?') + ' / ' + scoreMax + '</p>' +
        '<p><strong>Venue:</strong> ' + (decision.venue || '?') + '</p>' +
        '<p><strong>Score Range:</strong> ' + (decision.score_range ? decision.score_range.join('-') : '?') + '</p>' +
        '</div></div>';

      if (decision.per_dimension) {
        var bars = Object.entries(decision.per_dimension).map(function(entry) {
          const dim = entry[0], d = entry[1];
          const pct = Math.max(0, Math.min(100, (d.score / scoreMax) * 100));
          return '<div class="score-bar"><span class="label">' + dimLabel(dim) + '</span>' +
            '<div class="bar"><div class="fill" style="width:' + pct + '%"></div></div>' +
            '<span class="val">' + d.score + '/' + scoreMax + ' (conf: ' + (d.confidence != null ? d.confidence : '?') + ')</span></div>';
        }).join('');
        html += '<div class="card"><div class="card-header">各维度分数</div><div class="card-body">' + bars + '</div></div>';
      }

      if (decision.key_strengths && decision.key_strengths.length) {
        html += '<div class="card"><div class="card-header">关键评估</div><div class="card-body">';
        html += '<strong>优点:</strong><ul>' + decision.key_strengths.map(s => '<li>' + s + '</li>').join('') + '</ul>';
        if (decision.key_concerns && decision.key_concerns.length) {
          html += '<strong>担忧:</strong><ul>' + decision.key_concerns.map(s => '<li>' + s + '</li>').join('') + '</ul>';
        }
        html += '</div></div>';
      }

      if (decision.decision_rationale) {
        html += '<div class="card"><div class="card-header">决策依据</div><div class="card-body">' + decision.decision_rationale + '</div></div>';
      }

      // 3) Review markdown served by the backend
      box.innerHTML = html;
      try {
        const r = await fetch('/api/runs/' + runId + '/review');
        if (r.ok) {
          const md = await r.text();
          state.lastReviewMd = md;
          box.innerHTML += '<div class="card"><div class="card-header">综合评审' +
            '<button class="copy-icon" style="margin-left:auto;" onclick="copyReview(this)" title="复制全文">' +
            '<svg class="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>' +
            '<svg class="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>' +
            '</button></div>' +
            '<div class="card-body"><div class="yaml-output">' +
            md.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</div></div></div>';
        }
      } catch(e) { console.error('load review failed:', e); }
    }

    function copyReview(btn) {
      const text = state.lastReviewMd || '';
      if (!text) return;
      const done = () => {
        btn.classList.add('copied');
        setTimeout(() => { btn.classList.remove('copied'); }, 1500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
      } else {
        fallbackCopy(text, done);
      }
    }

    function fallbackCopy(text, done) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch(e) { alert('复制失败'); }
      document.body.removeChild(ta);
    }

    // ── Init ──
    (async function init() {
      // Load each section independently so one failure doesn't break the others
      try { await loadVenues(); } catch(e) { console.error('loadVenues failed:', e); }
      try { await loadRuns(); } catch(e) { console.error('loadRuns failed:', e); }
      setInterval(loadRuns, 5000);
      connectGlobalWS();
      moveNavThumb();
      onProviderChange();
    })();
  </script>

  <button class="theme-toggle" onclick="toggleTheme()" title="切换主题">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
  </button>
  <script>
    function toggleTheme() {
      const cur = document.documentElement.dataset.theme === 'space' ? 'paper' : 'space';
      document.documentElement.dataset.theme = cur;
      localStorage.setItem('prw-theme', cur);
    }
  </script>
