name: icml
display_name: "ICML 2025"

dimensions:
  - soundness
  - significance
  - originality
  - clarity

score_min: 1
score_max: 4
confidence_min: 0.0
confidence_max: 1.0

weights:
  soundness: 1.3
  significance: 1.2
  originality: 1.1
  clarity: 0.8

thresholds:
  - [3.75, "strong_accept"]
  - [3.25, "accept"]
  - [2.75, "weak_accept"]
  - [2.25, "borderline"]
  - [1.75, "weak_reject"]
  - [1.25, "reject"]
  - [0.0, "strong_reject"]

prompts_dir: "prompts/venues/icml"
